<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f4f7f8;
      line-height: 1.7;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .profile {
      background: #fff;
      border: 1px solid #dfe7ea;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(20, 35, 45, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      color: #12343b;
    }

    h2 {
      margin-top: 28px;
      font-size: 20px;
      color: #1d5c63;
    }

    p {
      margin: 0 0 16px;
    }

    ul {
      padding-left: 20px;
    }

    .tagline {
      color: #52666d;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main>
    <section class="profile">
      <h1>こんにちは、Jonahです。</h1>
      <p class="tagline">学ぶことと、ものづくりが好きです。</p>

      <h2>自己紹介</h2>
      <p>
        このページは、私のことを簡単に紹介するためのページです。
        興味のあることや、これから挑戦したいことを少しずつ更新していきます。
      </p>

      <h2>好きなこと</h2>
      <ul>
        <li>Webサイトを作ること</li>
        <li>新しい技術を学ぶこと</li>
        <li>アイデアを形にすること</li>
      </ul>

      <h2>ひとこと</h2>
      <p>
        見やすく、わかりやすいページ作りを目指しています。
      </p>
    </section>
  </main>
</body>
</html>
